name: 行情复盘生成器

on:
  schedule:
    # 北京时间 15:31 交易日后收盘 → UTC 7:31 周一至周五
    - cron: '31 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-review
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行复盘生成
        run: python market_reviewer.py

      - name: 检查是否有变更
        id: check
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交并推送变更
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-review.json
          git pull --rebase origin main
          git commit -m "📊 行情复盘 · $(TZ='Asia/Shanghai' date +'%m-%d %H:%M') · [skip ci]"
          git push

      - name: 部署到 GitHub Pages
        if: steps.check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🚀 部署行情复盘 ${{ github.sha }}'
