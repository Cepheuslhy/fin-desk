name: Qbot 每日策略评估

on:
  schedule:
    # 北京时间 15:30 (UTC+8) = UTC 07:30 — A股收盘后运行
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - 'pytrader/custom_strategies/customer_skill/strategies/multi_source_data.py'
      - 'pytrader/custom_strategies/customer_skill/strategies/_auto_daily_review.py'
      - '.github/workflows/daily_review.yml'

permissions:
  contents: write

jobs:
  daily-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests efinance

      - name: 运行每日评估
        id: review
        run: |
          cd pytrader/custom_strategies/customer_skill/strategies
          python _auto_daily_review.py
        continue-on-error: true

      - name: 复制日报到 Pages 根目录
        run: |
          SRC="pytrader/custom_strategies/customer_skill/strategies/daily_report.json"
          if [ -f "$SRC" ]; then
            cp "$SRC" ./daily_report.json
            echo "Copied daily_report.json to repo root"
          fi

      - name: 提交日报到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加日报文件 (策略目录 + Pages 根目录)
          git add pytrader/custom_strategies/customer_skill/strategies/daily_report.md || true
          git add pytrader/custom_strategies/customer_skill/strategies/daily_report.json || true
          git add daily_report.json || true
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 自动日报 $(date +'%Y-%m-%d')"
            git push
          fi
        continue-on-error: true

      - name: 摘要输出
        if: always()
        run: |
          REPORT="pytrader/custom_strategies/customer_skill/strategies/daily_report.md"
          if [ -f "$REPORT" ]; then
            {
              echo '## 📊 Qbot 每日策略评估'
              echo ''
              cat "$REPORT"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 日报生成失败，请检查日志" >> $GITHUB_STEP_SUMMARY
          fi
